# Utiliza la segunda versión del formato de configuración de Dependabot.
version: 2

# Define los ecosistemas que se revisarán de forma automática.
updates:
  # Mantiene actualizadas las acciones utilizadas en los workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"

  # Mantiene actualizadas las dependencias declaradas en pyproject.toml.
  - package-ecosystem: pip
    directory: "/service"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
