name: "Temporal · Corregir visor loopback"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: fix/loopback-preview-server
          fetch-depth: 0
          show-progress: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Ruff
        run: python -m pip install 'ruff>=0.5,<1'

      - name: Aplicar correcciones seguras y formato
        run: |
          ruff check --fix service/src/agent_control_hub/local_http.py service/tests/test_local_http.py
          ruff format service/src/agent_control_hub/local_http.py service/tests/test_local_http.py
          ruff check service/src/agent_control_hub/local_http.py service/tests/test_local_http.py
          ruff format --check service/src/agent_control_hub/local_http.py service/tests/test_local_http.py

      - name: Publicar cambios cuando existan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Ruff no ha necesitado modificar archivos."
            exit 0
          fi
          git add service/src/agent_control_hub/local_http.py service/tests/test_local_http.py
          git commit -m "Aplicar formato y correcciones de Ruff al visor loopback"
          git push origin HEAD:fix/loopback-preview-server
