name: "Temporal · Detectar profiles Hermes"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: fix/hermes-profile-discovery
          fetch-depth: 0
          show-progress: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Aplicar migración determinista
        run: python tools/_apply_hermes_profile_discovery.py

      - name: Instalar herramientas de calidad
        run: python -m pip install 'ruff>=0.5,<1'

      - name: Formatear y validar archivos modificados
        run: |
          ruff format service/src/agent_control_hub/adapters/hermes.py service/tests/test_hermes_adapter.py
          ruff check --fix service/src/agent_control_hub/adapters/hermes.py service/tests/test_hermes_adapter.py
          ruff format --check service/src/agent_control_hub/adapters/hermes.py service/tests/test_hermes_adapter.py
          ruff check service/src/agent_control_hub/adapters/hermes.py service/tests/test_hermes_adapter.py

      - name: Publicar implementación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/agent_control_hub/adapters/hermes.py service/tests/test_hermes_adapter.py
          git commit -m "Detectar automáticamente profiles de Hermes"
          git push origin HEAD:fix/hermes-profile-discovery
