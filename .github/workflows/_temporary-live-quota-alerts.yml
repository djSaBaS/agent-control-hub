name: "Temporal · Aplicar alertas de cuota en vivo"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: feature/live-codex-quota-alerts
          fetch-depth: 0
          show-progress: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Acotar el ancla duplicada de la fuente de cuotas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/_apply_live_quota_alerts.py")
          content = path.read_text(encoding="utf-8")
          old = '''    # Detiene la migración cuando el archivo no coincide con la revisión esperada.
              if occurrences != 1:
                  # Explica el archivo y el número de coincidencias observadas.
                  raise RuntimeError(f"Ancla no única en {path}: {occurrences}")
              # Sustituye únicamente la aparición validada.
              updated = content.replace(old, new, 1)
          '''
          new = '''    # Detiene la migración cuando el archivo no contiene el ancla esperada.
              if occurrences < 1:
                  # Explica el archivo y el número de coincidencias observadas.
                  raise RuntimeError(f"Ancla ausente en {path}: {occurrences}")
              # Sustituye la única aparición o la última cuando el bloque es compartido.
              if occurrences == 1:
                  # Conserva el comportamiento estricto para anclas inequívocas.
                  updated = content.replace(old, new, 1)
              else:
                  # Separa desde la última aparición para afectar RateLimitsSnapshot y no TokenUsage.
                  prefix, suffix = content.rsplit(old, 1)
                  # Reconstruye el archivo con la sustitución específica más tardía.
                  updated = prefix + new + suffix
          '''
          if old not in content:
              raise RuntimeError("No se encontró el bloque de validación de la migración")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Aplicar migración determinista
        run: python tools/_apply_live_quota_alerts.py

      - name: Formatear y corregir automáticamente
        run: |
          python -m pip install ruff
          ruff format service/src/agent_control_hub/models.py service/src/agent_control_hub/snapshot_service.py service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/codex.py service/src/agent_control_hub/codex_rate_limit_probe.py service/src/agent_control_hub/alerts.py service/tests/test_codex_adapter.py service/tests/test_codex_rate_limit_probe.py service/tests/test_alerts.py || true
          ruff check --fix service/src/agent_control_hub/models.py service/src/agent_control_hub/snapshot_service.py service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/codex.py service/src/agent_control_hub/codex_rate_limit_probe.py service/src/agent_control_hub/alerts.py service/tests/test_codex_adapter.py service/tests/test_codex_rate_limit_probe.py service/tests/test_alerts.py || true

      - name: Publicar implementación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/agent_control_hub/models.py service/src/agent_control_hub/snapshot_service.py service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/codex.py service/src/agent_control_hub/codex_rate_limit_probe.py service/src/agent_control_hub/alerts.py service/tests/test_codex_adapter.py service/tests/test_codex_rate_limit_probe.py service/tests/test_alerts.py scripts/run-codex-preview.ps1
          git commit -m "Detectar restauraciones reales de cuota y avisar en Windows"
          git push origin HEAD:feature/live-codex-quota-alerts
