name: "Temporal · Aplicar alertas de cuota en vivo"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: feature/live-codex-quota-alerts
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Aplicar migración determinista
        run: python tools/_apply_live_quota_alerts.py

      - name: Formatear y corregir automáticamente
        run: |
          python -m pip install ruff
          ruff format service/src/agent_control_hub/models.py service/src/agent_control_hub/snapshot_service.py service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/codex.py service/src/agent_control_hub/codex_rate_limit_probe.py service/src/agent_control_hub/alerts.py service/tests/test_codex_adapter.py service/tests/test_codex_rate_limit_probe.py service/tests/test_alerts.py
          ruff check --fix service/src/agent_control_hub/models.py service/src/agent_control_hub/snapshot_service.py service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/codex.py service/src/agent_control_hub/codex_rate_limit_probe.py service/src/agent_control_hub/alerts.py service/tests/test_codex_adapter.py service/tests/test_codex_rate_limit_probe.py service/tests/test_alerts.py || true

      - name: Publicar implementación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/agent_control_hub/models.py service/src/agent_control_hub/snapshot_service.py service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/codex.py service/src/agent_control_hub/codex_rate_limit_probe.py service/src/agent_control_hub/alerts.py service/tests/test_codex_adapter.py service/tests/test_codex_rate_limit_probe.py service/tests/test_alerts.py scripts/run-codex-preview.ps1
          git commit -m "Detectar restauraciones reales de cuota y avisar en Windows"
          git push origin HEAD:feature/live-codex-quota-alerts
