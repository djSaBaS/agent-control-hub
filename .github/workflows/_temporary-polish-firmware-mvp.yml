name: "Temporal · Pulir firmware MVP"

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: feature/firmware-mvp-multiplatform-alerts
          fetch-depth: 0
          show-progress: false

      - name: Aplicar correcciones deterministas
        run: python tools/_polish_firmware_mvp.py

      - name: Publicar correcciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/core2/src/main.cpp firmware/core2/src/ui.cpp
          git commit -m "Alinear navegación y validar versión del protocolo"
          git push origin HEAD:feature/firmware-mvp-multiplatform-alerts
