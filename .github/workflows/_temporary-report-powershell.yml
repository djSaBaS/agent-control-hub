name: "Temporal · Informe PSScriptAnalyzer"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: fix/loopback-preview-server
          fetch-depth: 0
          show-progress: false

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0

      - name: Generar informe estructurado
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Parameters = @{
              Path = "./scripts"
              Recurse = $true
              Severity = @("Error", "Warning")
              Settings = "PSGallery"
          }
          $Results = Invoke-ScriptAnalyzer @Parameters
          $Results |
              Select-Object ScriptName, Line, Column, RuleName, Severity, Message |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath ./tools/pssa-findings.json -Encoding UTF8

      - name: Publicar informe temporal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pssa-findings.json
          git commit -m "Publicar diagnóstico temporal de PSScriptAnalyzer"
          git push origin HEAD:fix/loopback-preview-server
