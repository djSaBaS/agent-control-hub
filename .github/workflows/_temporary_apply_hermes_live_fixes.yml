name: "Temporal · Aplicar correcciones Hermes en vivo"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v6
        with:
          ref: fix/hermes-live-and-snapshot-lock
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Aplicar migración determinista
        run: python tools/_apply_hermes_live_fixes.py

      - name: Formatear archivos modificados
        run: |
          python -m pip install ruff
          ruff format service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/hermes.py service/src/agent_control_hub/snapshot_service.py service/tests/test_hermes_adapter.py service/tests/test_main_snapshot_writer.py
          ruff check --fix service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/hermes.py service/src/agent_control_hub/snapshot_service.py service/tests/test_hermes_adapter.py service/tests/test_main_snapshot_writer.py

      - name: Publicar correcciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/agent_control_hub/main.py service/src/agent_control_hub/adapters/hermes.py service/src/agent_control_hub/snapshot_service.py service/tests/test_hermes_adapter.py service/tests/test_main_snapshot_writer.py
          git commit -m "Corregir telemetría en vivo de Hermes y bloqueos del snapshot"
          git push origin HEAD:fix/hermes-live-and-snapshot-lock
