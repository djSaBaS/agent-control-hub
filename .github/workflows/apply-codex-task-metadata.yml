name: "Temporal · Aplicar metadatos de tarea Codex"

on:
  push:
    branches:
      - agent/codex-conversation-objective
    paths:
      - "scripts/apply-codex-task-metadata-update.py"
      - ".github/workflows/apply-codex-task-metadata.yml"

permissions:
  contents: write

jobs:
  apply:
    name: "Aplicar y validar cambios"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Descargar la rama"
        uses: actions/checkout@v6
        with:
          ref: agent/codex-conversation-objective

      - name: "Preparar Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: "Instalar herramientas"
        working-directory: service
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: "Aplicar migración determinista"
        run: |
          set -euo pipefail
          python scripts/apply-codex-task-metadata-update.py

      - name: "Corregir y comprobar calidad"
        working-directory: service
        run: |
          set -euo pipefail
          python -m ruff check . --fix
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest

      - name: "Publicar los archivos validados"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/agent_control_hub/models.py
          git add service/src/agent_control_hub/adapters/codex.py
          git add tools/pc-viewer/index.html
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Separar conversación objetivo resultado y pendiente"
          git push origin HEAD:agent/codex-conversation-objective
