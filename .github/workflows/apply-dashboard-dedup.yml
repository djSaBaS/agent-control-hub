name: "Temporal · Aplicar deduplicación del dashboard"

on:
  push:
    branches:
      - "agent/deduplicate-codex-dashboard"
    paths:
      - ".github/scripts/apply_dashboard_dedup.py"
      - ".github/workflows/apply-dashboard-dedup.yml"

permissions:
  contents: write

jobs:
  apply:
    name: "Aplicar y validar deduplicación"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Descargar repositorio"
        uses: actions/checkout@v6
        with:
          ref: "agent/deduplicate-codex-dashboard"
          fetch-depth: 0

      - name: "Preparar Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: "Aplicar migración determinista"
        run: python .github/scripts/apply_dashboard_dedup.py

      - name: "Instalar dependencias de validación"
        working-directory: service
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: "Formatear código Python"
        working-directory: service
        run: python -m ruff format .

      - name: "Comprobar calidad"
        working-directory: service
        run: python -m ruff check .

      - name: "Comprobar tipado estricto"
        working-directory: service
        run: python -m mypy src

      - name: "Ejecutar pruebas"
        working-directory: service
        run: python -m pytest

      - name: "Publicar archivos validados"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            service/src/agent_control_hub/adapters/codex.py \
            service/src/agent_control_hub/adapters/codex_task_metadata.py \
            service/tests/test_codex_task_metadata.py \
            tools/pc-viewer/index.html
          if git diff --cached --quiet; then
            echo "No hay cambios adicionales que publicar."
            exit 0
          fi
          git commit -m "Eliminar duplicados de la telemetría de Codex"
          git push origin HEAD:agent/deduplicate-codex-dashboard
