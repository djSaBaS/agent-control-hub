name: "Diagnóstico temporal · Ruff"

on:
  pull_request:
    paths:
      - "service/**"
      - ".github/workflows/diagnostic-ruff.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    name: "Guardar diagnóstico Ruff"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service
        shell: bash

    steps:
      - name: "Descargar repositorio"
        uses: actions/checkout@v6

      - name: "Preparar Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: "Instalar dependencias"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: "Ejecutar Ruff y conservar salida"
        continue-on-error: true
        run: |
          mkdir -p test-results
          set +e
          python -m ruff check . --output-format=concise > test-results/ruff.log 2>&1
          status=$?
          echo "exit_code=$status" >> test-results/ruff.log
          exit 0

      - name: "Guardar diagnóstico"
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-ruff
          path: service/test-results/ruff.log
          if-no-files-found: error
          retention-days: 1
