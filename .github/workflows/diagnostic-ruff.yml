name: "Diagnóstico temporal · Ruff"

on:
  pull_request:
    paths:
      - "service/**"
      - ".github/workflows/diagnostic-ruff.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    name: "Generar corrección Ruff"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service
        shell: bash

    steps:
      - name: "Descargar repositorio"
        uses: actions/checkout@v6

      - name: "Preparar Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: "Instalar dependencias"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: "Aplicar correcciones Ruff en copia de trabajo"
        run: |
          set -euo pipefail
          python -m ruff check src/agent_control_hub/adapters/codex.py --fix --unsafe-fixes
          python -m ruff format src/agent_control_hub/adapters/codex.py
          python -m ruff check src/agent_control_hub/adapters/codex.py

      - name: "Guardar archivo corregido"
        uses: actions/upload-artifact@v4
        with:
          name: corrected-codex-adapter
          path: service/src/agent_control_hub/adapters/codex.py
          if-no-files-found: error
          retention-days: 1
