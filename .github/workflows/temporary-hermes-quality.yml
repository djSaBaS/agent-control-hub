name: "Temporal · Corregir calidad de Hermes"

on:
  push:
    branches:
      - agent/hermes-sqlite-telemetry

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: "1 · Descargar rama"
        uses: actions/checkout@v4
        with:
          ref: agent/hermes-sqlite-telemetry
          fetch-depth: 0

      - name: "2 · Preparar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "3 · Instalar herramientas"
        run: python -m pip install --editable "service[dev]"

      - name: "4 · Aplicar correcciones seguras"
        shell: bash
        run: |
          set -euo pipefail
          cd service
          python -m ruff check --fix . || true
          python -m ruff format .

      - name: "5 · Publicar correcciones"
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No hay cambios automáticos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service
          git commit -m "Aplicar formato y correcciones Ruff a Hermes"
          git push origin HEAD:agent/hermes-sqlite-telemetry

      - name: "6 · Guardar diagnóstico restante"
        if: always()
        shell: bash
        run: |
          cd service
          python -m ruff check . --output-format concise > ../ruff-hermes.log 2>&1 || true

      - name: "7 · Publicar diagnóstico"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-hermes
          path: ruff-hermes.log
