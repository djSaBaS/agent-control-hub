[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-hub"
version = "0.1.0"
description = "Local service for monitoring AI agents and sending normalized status to a physical display."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Juan Antonio Sánchez Plaza" }
]
dependencies = [
  "pydantic>=2.13.4,<3",
  "pyserial>=3.5,<4"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.5,<1",
  "types-pyserial>=3.5,<4"
]

[project.scripts]
agent-control = "agent_control_hub.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers"
]
junit_family = "xunit2"

[tool.coverage.run]
branch = true
source = ["agent_control_hub"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_control_hub"]
