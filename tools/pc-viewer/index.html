<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Control Hub · Datos reales</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f14;
      color: #edf2f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #172033, #0b0f14 45%); }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); }
    .subtitle { margin-top: 8px; color: #9da9b8; }
    .status { padding: 8px 12px; border: 1px solid #2d3748; border-radius: 999px; background: #141b26; white-space: nowrap; }
    .status.ok { border-color: #2f855a; }
    .status.error { border-color: #c53030; }
    .notice { display: none; margin-bottom: 20px; padding: 14px 16px; border-radius: 12px; background: #3b2f13; border: 1px solid #8a6d1f; color: #ffe8a3; }
    .notice.visible { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: rgba(20, 27, 38, 0.92); border: 1px solid #293241; border-radius: 18px; padding: 20px; box-shadow: 0 18px 45px rgba(0,0,0,.25); }
    .card h2, .card h3 { margin-top: 0; }
    .platform-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .badge { font-size: .78rem; padding: 5px 9px; border-radius: 999px; background: #123a2a; color: #a7f3d0; }
    .metric { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid #252d39; }
    .metric:last-child { border-bottom: 0; }
    .metric span:first-child { color: #9da9b8; }
    .metric strong { text-align: right; overflow-wrap: anywhere; }
    .limit { margin-top: 18px; }
    .limit-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .bar { height: 10px; background: #252d39; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: inherit; }
    .source { margin-top: 14px; color: #8290a3; font-size: .86rem; }
    .empty { color: #9da9b8; }
    details { margin-top: 20px; }
    summary { cursor: pointer; color: #b9c4d2; }
    pre { max-height: 340px; overflow: auto; padding: 16px; border-radius: 12px; background: #080b10; border: 1px solid #202734; font-size: .8rem; }
    footer { margin-top: 24px; color: #738094; font-size: .86rem; }
    @media (max-width: 640px) { header { flex-direction: column; } .status { white-space: normal; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Agent Control Hub</h1>
        <div class="subtitle">Vista local de telemetría real y sanitizada</div>
      </div>
      <div id="connection" class="status">Esperando snapshot.json…</div>
    </header>

    <div id="warning" class="notice"></div>
    <section id="platforms" class="grid"></section>

    <details>
      <summary>Ver JSON recibido</summary>
      <pre id="raw-json">Todavía no hay datos.</pre>
    </details>

    <footer>
      El visor se actualiza cada cinco segundos. Los campos nulos significan “dato no disponible”; nunca se sustituyen por valores simulados.
    </footer>
  </main>

  <script>
    const connection = document.getElementById('connection');
    const warning = document.getElementById('warning');
    const platforms = document.getElementById('platforms');
    const rawJson = document.getElementById('raw-json');

    const formatNumber = value => value == null ? 'No disponible' : new Intl.NumberFormat('es-ES').format(value);
    const formatDate = value => value ? new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'medium' }).format(new Date(value)) : 'No disponible';
    const ageMinutes = value => value ? Math.max(0, Math.round((Date.now() - new Date(value).getTime()) / 60000)) : null;

    function metric(label, value) {
      const row = document.createElement('div');
      row.className = 'metric';
      const name = document.createElement('span');
      name.textContent = label;
      const data = document.createElement('strong');
      data.textContent = value;
      row.append(name, data);
      return row;
    }

    function renderLimit(title, item) {
      if (!item) return null;
      const wrapper = document.createElement('div');
      wrapper.className = 'limit';
      const head = document.createElement('div');
      head.className = 'limit-head';
      const label = document.createElement('strong');
      label.textContent = title;
      const percent = document.createElement('span');
      percent.textContent = `${item.used_percent}% usado · ${item.remaining_percent}% restante`;
      head.append(label, percent);
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('span');
      fill.style.width = `${Math.min(100, Math.max(0, item.used_percent))}%`;
      bar.append(fill);
      wrapper.append(head, bar, metric('Ventana', `${item.window_minutes} minutos`), metric('Reinicio', formatDate(item.resets_at)));
      return wrapper;
    }

    function renderPlatform(platform) {
      const card = document.createElement('article');
      card.className = 'card';
      const head = document.createElement('div');
      head.className = 'platform-head';
      const title = document.createElement('h2');
      title.textContent = platform.display_name;
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = platform.token_usage ? 'Datos reales' : platform.status;
      head.append(title, badge);
      card.append(head);

      const usage = platform.token_usage;
      if (usage) {
        card.append(
          metric('Tokens de entrada', formatNumber(usage.input_tokens)),
          metric('Entrada desde caché', formatNumber(usage.cached_input_tokens)),
          metric('Tokens de salida', formatNumber(usage.output_tokens)),
          metric('Tokens de razonamiento', formatNumber(usage.reasoning_output_tokens)),
          metric('Total de la sesión', formatNumber(usage.total_tokens)),
          metric('Ventana de contexto', formatNumber(usage.model_context_window)),
          metric('Último dato', formatDate(usage.updated_at))
        );
        const source = document.createElement('div');
        source.className = 'source';
        source.textContent = `Fuente: ${usage.source} · ${usage.source_reference ?? 'sin referencia'}`;
        card.append(source);
      } else {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No se ha encontrado todavía un evento token_count real.';
        card.append(empty);
      }

      const limits = platform.rate_limits;
      if (limits) {
        card.append(metric('Plan detectado', limits.plan_type ?? 'No disponible'));
        const primary = renderLimit('Ventana corta', limits.primary);
        const secondary = renderLimit('Ventana semanal', limits.secondary);
        if (primary) card.append(primary);
        if (secondary) card.append(secondary);
        card.append(metric('Límites actualizados', formatDate(limits.updated_at)));
      }
      return card;
    }

    async function refresh() {
      try {
        const response = await fetch(`snapshot.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const snapshot = await response.json();
        rawJson.textContent = JSON.stringify(snapshot, null, 2);
        platforms.replaceChildren(...snapshot.platforms.map(renderPlatform));
        connection.className = 'status ok';
        connection.textContent = `Actualizado: ${formatDate(snapshot.generated_at)}`;

        const stale = snapshot.platforms.filter(item => item.rate_limits?.is_stale);
        if (stale.length) {
          const oldest = stale.map(item => ageMinutes(item.rate_limits.updated_at)).filter(value => value != null);
          warning.textContent = `Los límites de cuota son reales, pero están antiguos (${Math.max(...oldest)} minutos). Ejecuta una nueva tarea en Codex para refrescarlos.`;
          warning.className = 'notice visible';
        } else {
          warning.className = 'notice';
          warning.textContent = '';
        }
      } catch (error) {
        connection.className = 'status error';
        connection.textContent = `Sin datos: ${error.message}`;
        warning.className = 'notice visible';
        warning.textContent = 'Comprueba que el servicio está ejecutándose y que snapshot.json existe en esta carpeta.';
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
